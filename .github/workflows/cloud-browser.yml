name: Cloud Browser

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Session length (max 6h)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: desktop-state
          key: desktop-state-${{ github.run_id }}
          restore-keys: desktop-state-

      - name: Prepare state directories
        run: mkdir -p desktop-state/chrome desktop-state/downloads desktop-state/home

      - uses: docker/setup-buildx-action@v3

      - name: Build desktop image (cached)
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          tags: cloud-desktop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Start desktop container
        run: |
          docker run -d --name desktop \
            --shm-size=2g \
            -v "$(pwd)/desktop-state/chrome:/root/.config/chrome" \
            -v "$(pwd)/desktop-state/downloads:/root/Downloads" \
            -p 6080:6080 \
            cloud-desktop

          echo "Waiting for noVNC..."
          for i in $(seq 1 90); do
            curl -sf http://localhost:6080/ > /dev/null 2>&1 \
              && echo "Ready after ${i}s" && break
            sleep 2
          done
          curl -sf http://localhost:6080/ > /dev/null 2>&1 \
            || { echo "FAILED:"; docker logs desktop; exit 1; }

      - name: Open Cloudflare tunnel
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2025.4.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared tunnel --no-autoupdate --url http://localhost:6080 \
            > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { cat /tmp/cf.log; exit 1; }

          # High-quality noVNC URL: quality=9 (max JPEG), compression=2
          FULL="${URL}/vnc.html?autoconnect=true&resize=scale&quality=9&compression=2"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Your Cloud Desktop is Live

          ## Open on any device:
          ${FULL}

          Click **Connect** — no password needed.

          ---
          ### Installed and ready:
          - **Google Chrome** (opens automatically)
          - **Cloud Terminal** — black window, full Linux shell
          - **Java 17** — run MotiveWave: \`java -jar motivewave.jar\`
          - **Python 3, Node.js, git, wget, curl**
          - **Chrome profile + Downloads** saved between sessions

          ### Install anything in the terminal:
          | Command | Action |
          |---|---|
          | \`sudo apt install vlc\` | Any Linux app |
          | \`pip3 install pandas\` | Python packages |
          | \`sudo gdebi app.deb\` | .deb installer |
          | \`chmod +x *.AppImage && ./*.AppImage\` | AppImages |
          | \`java -jar app.jar\` | Java apps |

          Session: **${{ inputs.hours }}h** — state auto-saves on exit.
          EOF

          echo "=========================="
          echo "  LINK: $FULL"
          echo "=========================="

      - name: Keep session alive
        run: sleep $(( ${{ inputs.hours }} * 3600 - 120 ))

      - name: Save desktop state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: desktop-state
          key: desktop-state-${{ github.run_id }}
