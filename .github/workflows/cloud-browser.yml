name: Cloud Browser

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Session length in hours (max 6)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Build browser image
        run: docker build -t mybrowse-browser ./browser

      - name: Start browser container
        run: |
          docker run -d --name browser \
            --shm-size=2g \
            -p 6080:6080 \
            mybrowse-browser

          echo "Waiting for noVNC to be ready..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:6080/ > /dev/null 2>&1 && echo "noVNC is up after ${i}s" && break
            sleep 2
          done
          curl -sf http://localhost:6080/ > /dev/null 2>&1 || { echo "noVNC failed to start"; docker logs browser; exit 1; }

      - name: Start Cloudflare tunnel and publish URL
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2025.4.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

          cloudflared tunnel --no-autoupdate --url http://localhost:6080 \
            > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel failed:" && cat /tmp/cf.log && exit 1
          fi

          FULL="${URL}/vnc.html?autoconnect=true&resize=scale"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Your Cloud Browser is Live

          ## Open this link on any device:
          ${FULL}

          No password needed — just click Connect.

          Session expires in ${{ inputs.hours }} hour(s). Run the workflow again for a new session.
          EOF

          echo "========================================"
          echo "  YOUR LINK: $FULL"
          echo "========================================"

      - name: Keep session alive
        run: sleep $(( ${{ inputs.hours }} * 3600 ))
