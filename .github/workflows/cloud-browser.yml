name: Cloud Browser

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Session length (max 6h)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # ── Restore saved desktop state (Chrome profile, downloads, home) ─────
      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: desktop-state
          key: desktop-state-${{ github.run_id }}
          restore-keys: desktop-state-

      - name: Prepare state directories
        run: |
          mkdir -p desktop-state/chrome \
                   desktop-state/downloads \
                   desktop-state/home

      # ── Fast Docker build (layers cached after first run ~5min→~45sec) ────
      - uses: docker/setup-buildx-action@v3

      - name: Build desktop image (cached)
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          tags: cloud-desktop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # ── Start XPRA desktop container ──────────────────────────────────────
      - name: Start desktop
        run: |
          docker run -d --name desktop \
            --shm-size=2g \
            --cap-add=SYS_ADMIN \
            -v "$(pwd)/desktop-state/chrome:/root/.config/chrome" \
            -v "$(pwd)/desktop-state/downloads:/root/Downloads" \
            -v "$(pwd)/desktop-state/home:/root/apps" \
            -p 14500:14500 \
            cloud-desktop

          echo "Waiting for XPRA HTML5 server..."
          for i in $(seq 1 90); do
            curl -sf http://localhost:14500/ > /dev/null 2>&1 \
              && echo "XPRA ready after ${i}s" && break
            sleep 2
          done
          curl -sf http://localhost:14500/ > /dev/null 2>&1 \
            || { echo "FAILED — container logs:"; docker logs desktop; exit 1; }

      # ── Cloudflare tunnel ─────────────────────────────────────────────────
      - name: Open tunnel and publish URL
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2025.4.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

          cloudflared tunnel --no-autoupdate --url http://localhost:14500 \
            > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { cat /tmp/cf.log; exit 1; }

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Your Cloud Desktop is Live

          ## Open on any device:
          ${URL}

          Click **"Connect"** — no password needed.

          ---
          ### What you have:
          - **Google Chrome** — opens automatically
          - **Cloud Terminal** (black window) — full Linux shell
          - **Java 17** pre-installed — run MotiveWave, NinjaTrader, etc.
          - **Screen resizes** to fit your device automatically (XPRA)
          - **State saves** — Chrome profile + Downloads persist next session

          ### Install & run any app in the terminal:
          \`\`\`
          sudo apt install <app>          # Linux apps
          pip3 install <package>          # Python
          wget <url> && sudo gdebi *.deb  # .deb installer
          chmod +x *.AppImage && ./*.AppImage  # AppImages
          java -jar app.jar               # Java apps (MotiveWave etc.)
          \`\`\`

          Session expires in **${{ inputs.hours }}h**. Run again to resume — state is saved.
          EOF

          echo "========================================"
          echo "  LINK : $URL"
          echo "========================================"

      # ── Keep alive (reserve 2min at end for state save) ──────────────────
      - name: Keep session alive
        run: sleep $(( ${{ inputs.hours }} * 3600 - 120 ))

      # ── Save desktop state ────────────────────────────────────────────────
      - name: Save desktop state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: desktop-state
          key: desktop-state-${{ github.run_id }}
