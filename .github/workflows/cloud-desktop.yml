name: Cloud Desktop

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Session length (max 6h)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Restore session state
        uses: actions/cache/restore@v4
        with:
          path: session-state
          key: session-state-${{ github.run_id }}
          restore-keys: session-state-

      - name: Prepare state directories
        run: |
          mkdir -p session-state/chrome session-state/downloads
          chmod -R 777 session-state

      - uses: docker/setup-buildx-action@v3

      - name: Build desktop image (GHA-cached layers)
        uses: docker/build-push-action@v5
        with:
          context: ./browser
          load: true
          tags: cloud-desktop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get runner public IP
        run: echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      - name: Start Neko WebRTC desktop
        run: |
          NEKO_ICE='[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{"urls":["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turns:openrelay.metered.ca:443"],"username":"openrelayproject","credential":"openrelayproject"}]'

          docker run -d --name desktop \
            --shm-size=2g \
            -e NEKO_SCREEN="1920x1080@60" \
            -e NEKO_PASSWORD="cloud" \
            -e NEKO_PASSWORD_ADMIN="cloud" \
            -e NEKO_IMPLICIT_CONTROL="true" \
            -e NEKO_EPR="52000-52100" \
            -e NEKO_NAT1TO1="${{ env.RUNNER_IP }}" \
            -e NEKO_ICESERVERS="$NEKO_ICE" \
            -e NEKO_MAX_FPS="60" \
            -v "$(pwd)/session-state/chrome:/home/neko/.config/google-chrome" \
            -v "$(pwd)/session-state/downloads:/home/neko/Downloads" \
            -p 8080:8080 \
            -p 52000-52100:52000-52100/udp \
            cloud-desktop

          echo "Waiting for Neko..."
          for i in $(seq 1 45); do
            curl -sf http://localhost:8080/ > /dev/null 2>&1 && echo "Ready after $((i * 2))s" && break
            sleep 2
          done
          curl -sf http://localhost:8080/ > /dev/null 2>&1 || { docker logs desktop; exit 1; }

      - name: Open Cloudflare tunnel
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2025.4.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

          cloudflared tunnel --no-autoupdate --url http://localhost:8080 \
            > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { cat /tmp/cf.log; exit 1; }

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Cloud Desktop Ready

          ## Open on any device:
          $URL

          **Password:** \`cloud\`

          ---
          ### Why this is fast:
          - WebRTC peer-to-peer UDP stream — same tech as Shadow PC, Parsec, GeForce NOW
          - 60 FPS, 1920x1080, VP8 video — crisp and smooth
          - No VNC, no HTTP video proxying through Cloudflare for the video feed

          ### Your desktop includes:
          - XFCE full desktop — file manager, taskbar, right-click menus
          - Google Chrome opens automatically
          - Java 17 pre-installed — run MotiveWave, any .jar app
          - Terminal: right-click desktop → Open Terminal Here
          - Chrome profile + Downloads folder saved between sessions

          ### Install MotiveWave (open terminal, paste these lines):
          \`\`\`
          wget https://www.motivewave.com/downloads/MotiveWave_linux64.sh
          chmod +x MotiveWave_linux64.sh
          ./MotiveWave_linux64.sh
          \`\`\`

          Session: **${{ inputs.hours }}h** — auto-saves on exit.
          EOF

          echo "=========================="
          echo "  LINK: $URL"
          echo "  PASS: cloud"
          echo "=========================="

      - name: Keep session alive
        run: sleep $(( ${{ inputs.hours }} * 3600 - 120 ))

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session-state
          key: session-state-${{ github.run_id }}
