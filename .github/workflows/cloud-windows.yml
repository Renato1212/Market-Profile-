name: Cloud Windows

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Session length (max 6h)'
        required: true
        default: '6'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (need ~25 GB for Windows VM)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/lib/jvm /usr/local/lib/heroku
          sudo apt-get clean
          docker system prune -af --volumes
          df -h /

      - name: Verify KVM available
        run: |
          ls -la /dev/kvm
          sudo apt-get update && sudo apt-get install -y qemu-utils
          echo "KVM ready."

      - name: Restore Windows disk
        uses: actions/cache/restore@v4
        with:
          path: windows-storage
          key: cloud-windows-10-${{ github.run_id }}
          restore-keys: cloud-windows-10-

      - name: Prepare storage directory
        run: |
          mkdir -p windows-storage
          sudo chown -R 1000:1000 windows-storage
          du -sh windows-storage/ 2>/dev/null || echo "Storage empty (first run)"

      - name: Start Windows VM
        run: |
          docker run -d --name windows \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -p 8006:8006 \
            -v "$(pwd)/windows-storage:/storage" \
            -e VERSION="10" \
            -e RAM_SIZE="8G" \
            -e CPU_CORES="4" \
            -e DISK_SIZE="32G" \
            -e USERNAME="user" \
            -e PASSWORD="" \
            -e DISK_FMT="qcow2" \
            --restart no \
            dockurr/windows

          echo "Container started."
          sleep 5
          docker ps

      - name: Wait for Windows web viewer
        run: |
          echo "Waiting for Windows web viewer at port 8006..."
          for i in $(seq 1 750); do
            if curl -sf http://localhost:8006/ > /dev/null 2>&1; then
              echo "Web viewer ready after $((i * 2))s"
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- Progress at $((i * 2))s (Windows installing if first run) ---"
              docker logs --tail 5 windows 2>&1 | tail -5 || true
            fi
            sleep 2
          done
          curl -sf http://localhost:8006/ > /dev/null 2>&1 || {
            echo "FAILED to start Windows. Logs:"
            docker logs windows
            exit 1
          }

      - name: Open Cloudflare tunnel
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2025.4.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

          cloudflared tunnel --no-autoupdate --url http://localhost:8006 \
            > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { cat /tmp/cf.log; exit 1; }

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Your Cloud Windows 10 Desktop is Live

          ## Open this link on any device:
          ${URL}

          ---
          ### What you can do inside the desktop:
          - Open **Microsoft Edge** to download apps from any website
          - **Double-click .exe installers** (e.g., MotiveWave) — installs like a normal PC
          - Use **File Explorer**, **Start menu**, **Desktop**, **Downloads folder**
          - Install Chrome, Office, Steam, MotiveWave, anything Windows supports
          - Your **C:\\\\ drive persists** between sessions

          ### Notes:
          - **First run only:** Windows takes ~15 min to install. Wait for the desktop to appear.
          - **Subsequent runs:** Boot in under 1 minute (state restored from cache).
          - **Auto-login:** username \`user\`, no password.
          - Session: **${{ inputs.hours }}h** — work auto-saves on shutdown.
          EOF

          echo "================================="
          echo "  CLOUD WINDOWS: $URL"
          echo "================================="

      - name: Keep session alive
        run: sleep $(( ${{ inputs.hours }} * 3600 - 1500 ))

      - name: Gracefully shut down Windows VM
        if: always()
        run: |
          docker stop -t 90 windows || true
          du -sh windows-storage/ || true

      - name: Save Windows disk
        if: always()
        uses: actions/cache/save@v4
        with:
          path: windows-storage
          key: cloud-windows-10-${{ github.run_id }}
