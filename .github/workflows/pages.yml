name: GitHub Pages Preview

on:
  push:
    branches:
      - claude/atlas-futures-platform-IXHS6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: atlas/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: atlas/frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: atlas/frontend
        env:
          VITE_BASE_URL: /market-profile-/
        run: npm run build

      - name: Add 404.html for SPA client-side routing
        run: cp atlas/frontend/dist/index.html atlas/frontend/dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: atlas/frontend/dist
          force_orphan: true
          commit_message: 'deploy: ATLAS frontend ${{ github.sha }}'
