[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=warn

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac
autorestart=true
priority=1
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; No VNC password — the random trycloudflare.com URL is the access control
[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -rfbport 5900 -noncache -quiet
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=2
startsecs=2
startretries=15
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=python3 /opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 0.0.0.0:6080
autorestart=true
priority=3
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:chrome]
command=chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --start-maximized --new-window https://www.google.com
environment=DISPLAY=":99",HOME="/root"
autorestart=false
priority=4
startsecs=6
stdout_logfile=/dev/null
stderr_logfile=/dev/null
