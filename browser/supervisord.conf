[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=warn

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; 1 — virtual display
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac
autorestart=true
priority=1
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; 2 — VNC server on the virtual display (password set via VNC_PASS env var)
[program:x11vnc]
command=bash -c "x11vnc -display :99 -forever -passwd ${VNC_PASS} -shared -rfbport 5900 -noncache -quiet"
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=2
startsecs=2
startretries=15
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; 3 — noVNC WebSocket proxy (HTTP, tunnelled by cloudflared)
[program:novnc]
command=python3 /opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 0.0.0.0:6080
autorestart=true
priority=3
stdout_logfile=/dev/null
stderr_logfile=/dev/null

; 4 — Chrome on the virtual display
[program:chrome]
command=chromium --no-sandbox --disable-dev-shm-usage --disable-gpu \
        --start-maximized --new-window https://www.google.com
environment=DISPLAY=":99",HOME="/root"
autorestart=false
priority=4
startsecs=6
stdout_logfile=/dev/null
stderr_logfile=/dev/null
