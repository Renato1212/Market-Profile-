plugins {
    id 'java'
}

group = 'com.renato'
version = '1.0.0'
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
}

dependencies {
    // MotiveWave SDK — prefer the real SDK jar when present, fall back to compile stubs.
    // Real jar: place motivewave-sdk.jar at ~/MotiveWave/sdk/motivewave-sdk.jar
    def sdkDir  = file("${System.getProperty('user.home')}/MotiveWave/sdk")
    def stubJar = file("${projectDir}/sdk-stubs/motivewave-sdk-stubs.jar")
    if (sdkDir.exists()) {
        compileOnly fileTree(dir: sdkDir, include: ['*.jar'])
    } else {
        compileOnly files(stubJar)
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'confluence-heatmap.jar'
    // Output to releases/ in the project directory so it can be committed & downloaded.
    // When building locally, copy this jar to ~/MotiveWave Extensions/ manually or
    // set: destinationDirectory = file("${System.getProperty('user.home')}/MotiveWave Extensions")
    destinationDirectory = file("${projectDir}/releases")
    manifest {
        attributes(
            'Implementation-Title': 'Confluence Heatmap',
            'Implementation-Version': version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
